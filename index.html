:root{--bg:#090611;--panel:#171126;--gold:#e3b64e;--txt:#f5efff;--sub:#bcb0d1;--purple:#6c43a6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#21123c,#090611 55%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}main{max-width:850px;margin:auto;padding:24px 14px 60px}header{text-align:center;padding:20px 0}h1{color:var(--gold);letter-spacing:.12em;margin:0;font-size:clamp(30px,8vw,50px)}.tag{color:var(--sub);margin-top:6px}.panel,.result,.summary{background:#171126e8;border:1px solid #3a2854;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 12px 35px #0008}h2,h3{color:var(--gold)}.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{font:inherit}.cat,.btn{border:1px solid #5a4774;background:#241a37;color:var(--txt);padding:12px 8px;border-radius:12px;cursor:pointer}.cat.on,.btn.primary{border-color:var(--gold);background:#51327b;color:#fff}textarea{width:100%;min-height:80px;background:#0d0917;border:1px solid #4a3763;border-radius:12px;color:#fff;padding:12px;font:inherit}.hint{color:var(--sub);font-size:.9rem;margin:6px 0 10px}.deck{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.back{aspect-ratio:3/5;border:1px solid var(--gold);border-radius:8px;background:linear-gradient(145deg,#3b2860,#120c20);color:var(--gold);cursor:pointer;transition:.35s;perspective:800px}.back:hover{transform:translateY(-4px)}.back.chosen{opacity:.25;transform:rotateY(180deg)}.status{text-align:center;color:var(--gold);font-weight:700;margin:10px}#results{display:none}.cardrow{display:grid;grid-template-columns:125px 1fr;gap:16px}.cardrow img{width:100%;border-radius:9px}img.rev{transform:rotate(180deg)}.badge{display:inline-block;background:#4d3176;border:1px solid var(--gold);border-radius:999px;padding:4px 10px;color:var(--gold);font-weight:700}.title{color:var(--gold);font-weight:800;font-size:1.15rem;margin:8px 0}.block{margin:10px 0}.block b{display:block;color:var(--gold)}.summary{border:2px solid var(--gold);white-space:pre-wrap;line-height:1.8}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:22px 0}.notice{font-size:.84rem;color:var(--sub);text-align:center;margin-top:28px}#saveFallback{display:none;text-align:center}#saveFallback img{max-width:100%;border:1px solid var(--gold);border-radius:12px}@media(max-width:520px){.cats{grid-template-columns:repeat(2,1fr)}.deck{grid-template-columns:repeat(5,1fr)}.cardrow{grid-template-columns:95px 1fr;gap:11px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<script>

〜6か月程度",["reflect","pause"],["昔の人と今の人、心の中で比較大会してへん？🤣","過去の失敗を理由に、新しい挑戦まで止めんこと。","昔損したから全部怖い、になってへん？","昔の一言を何年再放送してるん🤣","過去の自分を今も裁き続けんでええ。","その再放送、そろそろ最終回にしよ。"]]},{"id":21,"name":"XXI 世界","image":"card21.PNG","u":["ひとつのサイクルが完成する時。達成したことを認めて一区切りつけることで、次の段階へ進みやすくなる。","ようやった。ちゃんと終わったで。次行く前に一回喜べ🤣","終わったことをちゃんと「完了」にする。自分にもご褒美。","🌱 近いうち","数日〜1か月程度",["complete","hope"],["関係がひとつの完成形へ。今ある幸せもちゃんと見て。","完成・達成。次行く前に『できた』を認めよ。","ひとつの目標達成が見えてきそう。","無理なく付き合える関係が整ってくる。","ようここまで来た。成長した自分を認定せぇ🤣","ようやった。まず祝え。次の宿題はその後や🤣"]],"r":["ゴールは近いのに、やり残しや中途半端な部分が引っかかっている状態。","あと1ミリやのに新しいこと始めんな🤣 先にこれ終わらせよ。","未完了をひとつだけ片付ける。","🌱 近いうち","2週間〜1か月程度",["complete","pause"],["あと一個話せば整うのに、そこ避けてへん？","95％完成で別企画始めるな🤣 残り5％やれ。","目標まであと少し。最後の詰めを。","解決したつもりのことが少し残ってそう。","『まだ足りん』より、最後の1ミリを終わらせる。","あと1ミリや。新しい風呂敷広げんな🤣"]]}]; const S={"current":{"go":"今は、動きたい気持ちがちゃんと出てきてる。","pause":"今は、無理に動かすより一回止まった方が見えやすい時みたいや。","release":"今、そろそろ手放した方がええもんに気づき始めてる。","balance":"今は、大きく変えるよりバランスを戻す方が先みたいや。","uncertainty":"今、見えへんことが多くて、ちょっと頭の中モヤってるな。","reflect":"今は外へ答え探しに行くより、自分の中を見た方が早そうや。","choice":"今ちょうど、何かを選ぶところに立ってる。","change":"今、流れが変わり始めてる。前と同じではおられへん時みたいや。","hope":"今、まだ小さいけど『こっちかも』って光が見え始めてる。","complete":"今、ひとつのことがゴール近くまで来てる。"},"challenge":{"go":"ただ、勢いだけで走ると置いてくもん出てきそうや。","pause":"ほんで今引っかかってるんは、動かん時まで無理に動かそうとしてるとこ。","release":"ほんで問題は、もう要らんもんまで握ってることや。","balance":"ほんで、どっかがちょっと極端になってる。","uncertainty":"ほんで分からん部分を、想像で埋めようとして余計ややこしなってる。","reflect":"ほんで考えすぎて、答え探しが迷子になりかけてる。","choice":"ほんで決めること自体より、『失いたくない』が邪魔してるかもしれん。","change":"ほんで、変わる必要は感じてるのに元へ戻そうとしてるとこがある。","hope":"ほんで『ほんまにいけるん？』って、自分で希望を疑ってる。","complete":"ほんで、あとちょっとのところを残したまま次へ行こうとしてる。"},"advice":{"go":"考えるんはもう十分。今回は動いた方が話早い🤣","pause":"動かすことより、今は止まって見る方が仕事や。","release":"新しいもん入れたい言う前に、その手に持ってる古いやつ離そ🤣","balance":"全部変えんでええ。ズレてるとこ1個戻したら流れ変わる。","uncertainty":"まだ材料足らん。分からん時に答え作ったら、それ妄想や🤣","reflect":"人に聞く前に、一回自分に聞いてみ。あんた、ほんまはどうしたいん？","choice":"正解当て大会ちゃう。選んだあと自分が納得できる方を見よ。","change":"元通りにすることだけが正解ちゃう。変わったから行ける場所もある。","hope":"まだ全部見えてへん。でも小さい光ひとつあったら今日は十分や。","complete":"もう出来てるとこまで『まだまだ』言うな。まず終わらせて喜べ🤣"},"ending":{"love":"恋愛は相手のカードまで勝手に引かれへん🤣 自分がどうしたいかは、自分で決めてええ。","work":"仕事は考えてるだけでは勤怠つかん🤣 今日できること1個だけやろ。","money":"お金は気合いより数字や🤣 一回ちゃんと財布の中身と相談しよ。","relation":"人間関係、全部分かり合おうとせんでええ。ちょうどええ距離も立派な答えや。","self":"結局いちばん長く付き合うん自分や。自分の本音まで置いていくなよ。","general":"全部いっぺんにどうにかせんでええ。今日の1ミリだけ動かそ。"}};
const CK=["love","work","money","relation","self","general"], CN={love:"❤️ 恋愛",work:"💼 仕事",money:"💰 お金",relation:"🤝 人間関係",self:"🌱 自分自身",general:"🌈 総合運"}, ROLES=["① 現在","② 課題","③ この先・アドバイス"];
let st={cat:"love",chosen:[],order:[],timing:null,summary:""};
const $=s=>document.querySelector(s); function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pos(it){return it.rev?it.card.r:it.card.u} function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function cats(){$("#cats").innerHTML="";CK.forEach(k=>{let b=document.createElement("button");b.className="cat"+(k===st.cat?" on":"");b.textContent=CN[k];b.onclick=()=>{st.cat=k;cats()};$("#cats").append(b)})}
function deck(){st.order=shuffle([...Array(22).keys()]);$("#deck").innerHTML="";st.order.forEach(id=>{let b=document.createElement("button");b.className="back";b.textContent="✦";b.setAttribute("aria-label","裏向きのカード");b.onclick=()=>pick(id,b);$("#deck").append(b)})}
function pick(id,b){if(st.chosen.length>=3)return; b.disabled=true;b.classList.add("chosen");st.chosen.push({card:C[id],rev:Math.random()<.5});$("#status").textContent=st.chosen.length+" / 3";if(st.chosen.length===3)setTimeout(render,280)}
function cardHTML(it,i,timing=false){let d=pos(it),pl=it.rev?"逆位置":"正位置",cat=d[6][CK.indexOf(st.cat)];return `<div class="result"><span class="badge">${timing?"④ 時期":ROLES[i]}</span><div class="cardrow"><div><img src="${it.card.image}" alt="${esc(it.card.name)} ${pl}" class="${it.rev?"rev":""}"></div><div><div class="title">${esc(it.card.name)} 【${pl}】</div>${timing?`<div class="block"><b>${esc(d[3])}</b>${esc(d[4])}</div><div class="hint">※時期はUMEKO ARCANA独自の目安です。未来の日付を保証するものではありません。</div>`:`<div class="block">${esc(d[0])}</div><div class="block"><b>${CN[st.cat]}</b>${esc(cat)}</div><div class="block"><b>🥸 うめこ訳</b>「${esc(d[1])}」</div><div class="block"><b>👉 ほな、どうする？</b>${esc(d[2])}</div>`}</div></div></div>`}
function render(){$("#setup").style.display="none";$("#results").style.display="block";$("#mainResults").innerHTML=st.chosen.map((x,i)=>cardHTML(x,i)).join("");let a=pos(st.chosen[0])[5][0],b=pos(st.chosen[1])[5][0],c=pos(st.chosen[2])[5][0];st.summary=[S.current[a],S.challenge[b],S.advice[c],S.ending[st.cat]].join("\n\n");$("#sum").textContent=st.summary;window.scrollTo({top:0,behavior:"smooth"})}
$("#timingYes").onclick=()=>{let used=st.chosen.map(x=>x.card.id),rem=C.filter(x=>!used.includes(x.id)),card=rem[Math.floor(Math.random()*rem.length)];st.timing={card,rev:Math.random()<.5};$("#timingAsk").style.display="none";$("#timingResult").innerHTML=cardHTML(st.timing,3,true)};
$("#timingNo").onclick=()=>$("#timingAsk").style.display="none";
$("#reset").onclick=()=>{st={cat:"love",chosen:[],order:[],timing:null,summary:""};$("#memo").value="";$("#status").textContent="0 / 3";$("#timingResult").innerHTML="";$("#timingAsk").style.display="block";$("#saveFallback").style.display="none";$("#results").style.display="none";$("#setup").style.display="block";cats();deck();window.scrollTo(0,0)};

<div class="card-lightbox" id="cardLightbox" role="dialog" aria-modal="true" aria-label="カード拡大表示">
  <button class="card-lightbox-close" id="cardLightboxClose" type="button" aria-label="閉じる">×</button>
  <img id="cardLightboxImage" src="" alt="">
</div>


<script>
(() => {
  const box = document.getElementById('cardLightbox');
  const big = document.getElementById('cardLightboxImage');
  const close = document.getElementById('cardLightboxClose');
  if (!box || !big || !close) return;

  const isCardImage = (img) => {
    const src = img.getAttribute('src') || '';
    return /(?:^|\/)card\d{2}\.PNG(?:\?|$)/i.test(src);
  };

  document.addEventListener('click', (e) => {
    const img = e.target.closest && e.target.closest('img');
    if (!img || !isCardImage(img)) return;

    /* Do not zoom the small face-down selection deck; only visible/revealed card art. */
    const deckish = img.closest('.deck, #deck, .card-grid, #cardGrid, .cards, #cards');
    const resultish = img.closest('.result, #result, .results, #results, .reading, #reading, .result-card, .resultCard, .reading-card, .readingCard, .result-item, .resultItem');
    if (deckish && !resultish) return;

    big.src = img.src;
    big.alt = img.alt || 'タロットカード拡大';
    box.classList.add('open');
    document.body.style.overflow = 'hidden';
    close.focus();
  });

  const shut = () => {
    box.classList.remove('open');
    document.body.style.overflow = '';
    big.removeAttribute('src');
  };
  close.addEventListener('click', shut);
  box.addEventListener('click', (e) => { if (e.target === box) shut(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && box.classList.contains('open')) shut(); });
})();
</script>
